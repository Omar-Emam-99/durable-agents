# Pre-commit hooks for moj-mizan-temporal.
#
# Hooks run only on staged files, so the repo's pre-existing lint debt in
# untouched files will not block commits. Tools are invoked through `uv run`
# so their versions always match the ones pinned in pyproject.toml.
#
# Setup:  uv run pre-commit install
# Run manually on everything:  uv run pre-commit run --all-files
# Run the (manual-stage) type check:  uv run pre-commit run mypy --hook-stage manual --all-files

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  - repo: local
    hooks:
      # Ruff owns linting AND import sorting (the "I" rule is enabled in
      # pyproject.toml), so isort is intentionally not run here to avoid the
      # two tools fighting over import order.
      - id: ruff
        name: ruff (lint + autofix)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: black
        name: black (format)
        entry: uv run black
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Type checking is heavier and there is pre-existing debt, so it runs on
      # the whole package as a manual/CI stage rather than on every commit.
      - id: mypy
        name: mypy (type check, manual)
        entry: uv run mypy src
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
